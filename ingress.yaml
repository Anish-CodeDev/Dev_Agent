apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-agent-ingress
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dev-agent-harness-service
            port:
              number: 8000